---
- name: Deploy University Student Portal
  hosts: app
  become: true

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ docker_apt_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: docker_repo

    - name: Refresh apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo.changed

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ repo_root }}/Dockerfile"
        dest: "{{ project_dir }}/Dockerfile"
        mode: "0644"
      register: dockerfile_copy

    - name: Copy .dockerignore
      ansible.builtin.copy:
        src: "{{ repo_root }}/.dockerignore"
        dest: "{{ project_dir }}/.dockerignore"
        mode: "0644"

    - name: Copy compose.yml
      ansible.builtin.copy:
        src: "{{ repo_root }}/compose.yml"
        dest: "{{ project_dir }}/compose.yml"
        mode: "0644"

    - name: Copy app directory
      ansible.builtin.copy:
        src: "{{ repo_root }}/app"
        dest: "{{ project_dir }}/"
        mode: preserve
      register: app_copy

    - name: Render .env from variables
      ansible.builtin.template:
        src: env.j2
        dest: "{{ project_dir }}/.env"
        mode: "0600"

    - name: Start portal and Redis with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        files:
          - compose.yml
        state: present
        pull: never
        # Yalnız kod/Dockerfile dəyişəndə yenidən build et (idempotentlik üçün)
        build: "{{ 'always' if (dockerfile_copy.changed or app_copy.changed) else 'policy' }}"

    - name: Check portal /health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ portal_port }}/health"
        return_content: true
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
      changed_when: false

    - name: Show health check result
      ansible.builtin.debug:
        msg:
          - "Portal /health cavabı: {{ health.json }}"
          - "HTTP status: {{ health.status }}"
          - "Portal ünvanı: http://{{ ansible_host | default(inventory_hostname) }}:{{ portal_port }}"
